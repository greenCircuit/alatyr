# private-net — workloads that bridge to on-prem / private (RFC1918) networks.
# This box exists to exercise the LAN badges nothing else does: private-CIDR
# ingress and egress. No mesh, no cross-namespace arrows — each workload talks
# only to a private CIDR block, which renders as its own node.
#
#   10.0.0.0/8      ⇄ vpn-gw               lan-full     (in + out to the corp network)
#   192.168.0.0/16  ─▶ ldap-proxy          lan-ingress  (directory reached from the LAN)
#   backup-agent    ─▶ 172.16.0.0/12       lan-egress   (ships backups off to private DC)
#   telemetry-shipper ─▶ 0.0.0.0/0  except pod+svc CIDR internet-egress with cluster loopback carved out
#   metrics-relay   ─▶ 172.20.5.42/32      lan-egress   (paired with calico GNP allowing the whole
#                                                       172.20.0.0/16 corp metrics range → renders
#                                                       "cidr scope mismatch" issue: engines disagree
#                                                       on breadth for the same aggregate)
---
apiVersion: v1
kind: Namespace
metadata:
  name: private-net
  labels:
    kubernetes.io/metadata.name: private-net
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-gw
  namespace: private-net
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vpn-gw
  template:
    metadata:
      labels:
        app: vpn-gw
    spec:
      containers:
        - name: vpn-gw
          image: registry.example.com/netops/vpn-gw:3.2.0
          ports:
            - containerPort: 1194
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-proxy
  namespace: private-net
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ldap-proxy
  template:
    metadata:
      labels:
        app: ldap-proxy
    spec:
      containers:
        - name: ldap-proxy
          image: registry.example.com/netops/ldap-proxy:3.2.0
          ports:
            - containerPort: 636
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-agent
  namespace: private-net
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-agent
  template:
    metadata:
      labels:
        app: backup-agent
    spec:
      containers:
        - name: backup-agent
          image: registry.example.com/netops/backup-agent:3.2.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-shipper
  namespace: private-net
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-shipper
  template:
    metadata:
      labels:
        app: telemetry-shipper
    spec:
      containers:
        - name: telemetry-shipper
          image: registry.example.com/netops/telemetry-shipper:3.2.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-relay
  namespace: private-net
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-relay
  template:
    metadata:
      labels:
        app: metrics-relay
    spec:
      containers:
        - name: metrics-relay
          image: registry.example.com/netops/metrics-relay:3.2.0
---
# vpn-gw: terminates tunnels from the corporate network and dials back into it.
# Ingress + egress both to the private 10.0.0.0/8 range. -> lan-full
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-gw-netpol
  namespace: private-net
spec:
  podSelector:
    matchLabels:
      app: vpn-gw
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 1194
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 1194
---
# ldap-proxy: directory endpoint reached from the office LAN; no egress.
# -> lan-ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ldap-proxy-netpol
  namespace: private-net
spec:
  podSelector:
    matchLabels:
      app: ldap-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 636
  egress: []
---
# backup-agent: ships backups off to a private data-centre range; nothing reaches
# it. -> lan-egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-agent-netpol
  namespace: private-net
spec:
  podSelector:
    matchLabels:
      app: backup-agent
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - protocol: TCP
          port: 443
---
# telemetry-shipper: defense-in-depth pattern. Egress ALL of the internet
# (0.0.0.0/0) but explicitly carve out the cluster pod + service CIDRs — the
# workload must never loop back into the mesh. Exercises ipBlock.except:
# expandPeerRules emits one ActionAllow rule for the covering CIDR plus two
# ActionDeny rules (Coverage=CoverageExcept) for the pod/svc carve-outs. In
# reachability, IsCIDRClusterAccessRule promotes both the allow and the excepts,
# so any src pod → telemetry-shipper (and telemetry-shipper → any dst pod)
# resolves to ReasonExplicitDeny even though 0.0.0.0/0 covers everything.
#
# CIDRs match defaultConfig.yaml (pod 10.42.0.0/24, svc 10.43.0.0/24) so the
# fixture works out of the box under DEMO_MODE=true. -> internet-egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-shipper-netpol
  namespace: private-net
spec:
  podSelector:
    matchLabels:
      app: telemetry-shipper
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/24
              - 10.43.0.0/24
      ports:
        - protocol: TCP
          port: 443
---
# metrics-relay: ships fleet metrics off to one host in the corporate metrics
# range. k8s NP only names the single host 172.20.5.42/32; the paired Calico
# GNP egress-corp-metrics-lan (60-calico-globals.yaml) allows the whole
# 172.20.0.0/16 range. Two engines, two CIDR nodes (a /32 from k8s and a /16
# from calico); the pair src → 172.20.0.0/16 fires as "cidr scope mismatch"
# because calico allows the aggregate but k8s only permits a strict subset.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-relay-netpol
  namespace: private-net
spec:
  podSelector:
    matchLabels:
      app: metrics-relay
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.5.42/32
      ports:
        - protocol: TCP
          port: 9090
