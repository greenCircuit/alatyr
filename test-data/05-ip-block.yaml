# Case 5: ipBlock egress (external CIDR target)
# Expected graph edge: ip-block-src --> 1.1.1.1/32  (egress, workload, target is the CIDR string)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ip-block-src
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ip-block-src
  template:
    metadata:
      labels:
        app: ip-block-src
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ip-block
  namespace: test-netpol-a
spec:
  podSelector:
    matchLabels:
      app: ip-block-src
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 1.1.1.1/32
