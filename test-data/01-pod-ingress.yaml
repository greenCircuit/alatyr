# Case 1: pod-selector-only ingress (same namespace)
# Expected graph edge: pod-ingress-src --> pod-ingress-dst  (ingress, workload)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-ingress-src
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-ingress-src
  template:
    metadata:
      labels:
        app: pod-ingress-src
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-ingress-dst
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-ingress-dst
  template:
    metadata:
      labels:
        app: pod-ingress-dst
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-ingress
  namespace: test-netpol-a
spec:
  podSelector:
    matchLabels:
      app: pod-ingress-dst
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pod-ingress-src
