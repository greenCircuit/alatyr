# Case 3: namespace-selector-only ingress (entire namespace as source)
# Expected graph edge: test-netpol-b (namespace node) --> ns-ingress-dst  (ingress, namespace)
# If this edge targets a workload node instead of the namespace node, the ns-only branch is broken.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ns-ingress-dst
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ns-ingress-dst
  template:
    metadata:
      labels:
        app: ns-ingress-dst
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ns-ingress-src
  namespace: test-netpol-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ns-ingress-src
  template:
    metadata:
      labels:
        app: ns-ingress-src
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ns-ingress
  namespace: test-netpol-a
spec:
  podSelector:
    matchLabels:
      app: ns-ingress-dst
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: test-netpol-b
