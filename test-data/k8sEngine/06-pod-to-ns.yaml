# Case 6: pod egress to entire namespace (namespace-only destination)
# Expected graph edge: pod-to-ns-src --> test-netpol-b (namespace node)  (egress, namespace)
# If the edge targets individual pods instead of the namespace node, the ns-only egress branch is broken.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-to-ns-src
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-to-ns-src
  template:
    metadata:
      labels:
        app: pod-to-ns-src
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-to-ns
  namespace: test-netpol-a
spec:
  podSelector:
    matchLabels:
      app: pod-to-ns-src
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: test-netpol-b
