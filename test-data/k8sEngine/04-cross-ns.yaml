# Case 4: both namespaceSelector + podSelector (cross-namespace, specific pod)
# Expected graph edge: cross-ns-src --> cross-ns-dst  (ingress, workload)
# If this edge appears for pods in the WRONG namespace, the ns-filter in the both-branch is broken.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-ns-src
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cross-ns-src
  template:
    metadata:
      labels:
        app: cross-ns-src
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-ns-dst
  namespace: test-netpol-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cross-ns-dst
  template:
    metadata:
      labels:
        app: cross-ns-dst
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cross-ns
  namespace: test-netpol-b
spec:
  podSelector:
    matchLabels:
      app: cross-ns-dst
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: test-netpol-a
          podSelector:
            matchLabels:
              app: cross-ns-src
