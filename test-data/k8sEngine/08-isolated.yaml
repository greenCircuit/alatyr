# Case 8: fully isolated workload (deny-all ingress + egress, no internet rules)
# Expected badge: isolated
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isolated-svc
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: isolated-svc
  template:
    metadata:
      labels:
        app: isolated-svc
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolated-svc-deny-all
  namespace: test-netpol-a
spec:
  podSelector:
    matchLabels:
      app: isolated-svc
  policyTypes:
    - Ingress
    - Egress
