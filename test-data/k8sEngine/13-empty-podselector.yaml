# Case 13: empty podSelector struct ({} not nil) — flux-system pattern
# `from: - podSelector: {}` means all pods in same namespace, distinct from nil podSelector
# Expected badge: ns-ingress-access on flux-receiver (catch-all same-ns ingress, no egress lock)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-receiver
  namespace: test-netpol-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux-receiver
  template:
    metadata:
      labels:
        app: flux-receiver
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-receiver-allow-same-ns
  namespace: test-netpol-b
spec:
  podSelector:
    matchLabels:
      app: flux-receiver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
