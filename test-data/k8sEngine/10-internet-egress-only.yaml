# Case 10: outbound-only worker — internet egress allowed, ingress fully denied
# Expected badges: internet-egress (egress 0.0.0.0/0 explicit, no ingress rules)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbound-worker
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbound-worker
  template:
    metadata:
      labels:
        app: outbound-worker
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outbound-worker-egress
  namespace: test-netpol-a
spec:
  podSelector:
    matchLabels:
      app: outbound-worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
