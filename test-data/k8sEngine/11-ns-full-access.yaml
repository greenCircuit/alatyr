# Case 11: workload allows full intra-namespace access (catch-all ingress + egress)
# Expected badge: ns-full-access (collapsed from ns-ingress-access + ns-egress-access)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inner-broker
  namespace: test-netpol-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inner-broker
  template:
    metadata:
      labels:
        app: inner-broker
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inner-broker-same-ns
  namespace: test-netpol-b
spec:
  podSelector:
    matchLabels:
      app: inner-broker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
