# Case 2: pod-selector-only egress (same namespace)
# Expected graph edge: pod-egress-src --> pod-egress-dst  (egress, workload)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-egress-src
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-egress-src
  template:
    metadata:
      labels:
        app: pod-egress-src
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-egress-dst
  namespace: test-netpol-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-egress-dst
  template:
    metadata:
      labels:
        app: pod-egress-dst
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod-egress
  namespace: test-netpol-a
spec:
  podSelector:
    matchLabels:
      app: pod-egress-src
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pod-egress-dst
