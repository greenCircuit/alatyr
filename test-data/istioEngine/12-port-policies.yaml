# Case 12: Port-restricted NetworkPolicies in an ambient mesh ns.
# Two workloads in istio-mesh-a. Egress on port-client allows two app ports
# to port-server. Ingress on port-server allows two ports from port-client,
# one of which is the ztunnel HBONE port (15008) so ambient traffic flows.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-client
  namespace: istio-mesh-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-client
  template:
    metadata:
      labels:
        app: port-client
    spec:
      containers:
        - name: app
          image: curlimages/curl:latest
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-server
  namespace: istio-mesh-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-server
  template:
    metadata:
      labels:
        app: port-server
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 8080
            - containerPort: 8443
---
# Egress on port-client → port-server, two app ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: port-client-egress
  namespace: istio-mesh-a
spec:
  podSelector:
    matchLabels:
      app: port-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: port-server
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
---
# Ingress on port-server ← port-client. Port 8080 is the app port; port
# 15008 is the ztunnel HBONE port required for ambient mesh delivery.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: port-server-ingress
  namespace: istio-mesh-a
spec:
  podSelector:
    matchLabels:
      app: port-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: port-client
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
