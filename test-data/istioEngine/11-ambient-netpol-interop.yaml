# Ambient + NetworkPolicy interop test.
# Exercises ValidateExternalRule which fires when:
#   - workload is in ambient mesh (ns has istio.io/dataplane-mode: ambient)
#   - any non-istio engine has a port-restricted ingress rule for the workload
#   - the ztunnel HBONE port (15008) is NOT among the allowed ports
#
# istio-mesh-a is ambient (00-namespaces.yaml). Two workloads here:
#   - ambient-restricted: NP allows only port 8080 → traffic via ztunnel
#     (port 15008) is dropped. Expect issue on click.
#   - ambient-ok: NP allows port 8080 AND port 15008 (ztunnel HBONE) →
#     no issue.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambient-restricted
  namespace: istio-mesh-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ambient-restricted
  template:
    metadata:
      labels:
        app: ambient-restricted
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
# Ingress allows port 8080 only (from test-netpol-a). Port 15008 (ztunnel
# HBONE) NOT allowed → ambient mesh traffic gets dropped. Expect issue.
# Note: explicit `from:` is required so the k8spolicy engine emits rules
# the validator can inspect — NPs without `from` produce no rules today.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ambient-restricted-np
  namespace: istio-mesh-a
spec:
  podSelector:
    matchLabels:
      app: ambient-restricted
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: test-netpol-a
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambient-ok
  namespace: istio-mesh-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ambient-ok
  template:
    metadata:
      labels:
        app: ambient-ok
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
# Same port 8080 restriction but adds port 15008 (ztunnel HBONE). Ambient
# traffic flows through. No issue expected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ambient-ok-np
  namespace: istio-mesh-a
spec:
  podSelector:
    matchLabels:
      app: ambient-ok
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: test-netpol-a
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
