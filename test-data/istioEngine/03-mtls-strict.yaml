# Case 3: PeerAuthentication enforcing STRICT mTLS namespace-wide.
# All workloads in istio-mesh-b require mTLS for inbound traffic.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtls-strict-app
  namespace: istio-mesh-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mtls-strict-app
  template:
    metadata:
      labels:
        app: mtls-strict-app
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: require-mtls
  namespace: istio-mesh-b
spec:
  mtls:
    mode: STRICT
