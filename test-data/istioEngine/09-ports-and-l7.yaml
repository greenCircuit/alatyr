# Case 9: AuthorizationPolicy ALLOW combining L4 ports + L7 paths/methods.
# Expected: allow edge mixed-client --> mixed-server with ports 8443
# AND L7 (methods=GET paths=/v2/*) — each port rule carries the same L7 set.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixed-client
  namespace: istio-mesh-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixed-client
  template:
    metadata:
      labels:
        app: mixed-client
    spec:
      containers:
        - name: app
          image: curlimages/curl:latest
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixed-server
  namespace: istio-mesh-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixed-server
  template:
    metadata:
      labels:
        app: mixed-server
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 8443
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-readonly-tls
  namespace: istio-mesh-a
spec:
  selector:
    matchLabels:
      app: mixed-server
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - "istio-mesh-a"
      to:
        - operation:
            ports: ["8443"]
            methods: ["GET", "HEAD"]
            paths: ["/v2/*"]
