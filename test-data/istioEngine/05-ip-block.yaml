# Case 5: AuthorizationPolicy ALLOW from explicit source IP block.
# Istio AuthZ supports source.ipBlocks (not destination CIDRs).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipblock-target
  namespace: istio-mesh-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipblock-target
  template:
    metadata:
      labels:
        app: ipblock-target
    spec:
      containers:
        - name: app
          image: nginx:alpine
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-from-corp-net
  namespace: istio-mesh-a
spec:
  selector:
    matchLabels:
      app: ipblock-target
  action: ALLOW
  rules:
    - from:
        - source:
            ipBlocks:
              - "10.42.0.0/16"
