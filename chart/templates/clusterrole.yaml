apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "alatyr.fullname" . }}
  labels:
    {{- include "alatyr.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.serviceAccount.k8s }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.serviceAccount.istio }}
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.serviceAccount.calico }}
  # Calico aggregated API (projectcalico.org/v3) enforces tier RBAC:
  # reads need the tier itself plus the tier.<resource> pseudo-resource.
  - apiGroups: ["projectcalico.org"]
    resources: ["tiers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["projectcalico.org"]
    resources:
      - "globalnetworkpolicies"
      - "tier.globalnetworkpolicies"
    verbs: ["get", "list", "watch"]
  {{- end }}
