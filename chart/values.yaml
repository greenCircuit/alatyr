replicaCount: 1

image:
  repository: registry.dev.local/home-lab/network-policy-visualizer
  pullPolicy: Always
  tag: "0.0.2-1-add-labels-for-workloads"  # defaults to Chart.appVersion

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podLabels: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

