variables:
  GITHUB_USER: "greenCircuit"
  GITHUB_REPO: "greenCircuit/alatyr"
  GHCR_IMAGE: "ghcr.io/greencircuit/alatyr"


stages:
  - semver
  - test
  - build
  - smoke-tests
  - security
  - release

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - project: home-lab/pipeline-catalog
    file: pipelines/security.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/build.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/release.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/k8s.yaml


release-dry-run:
  extends: .semantic-release-dry-run

# TESTS
go-lint:
  stage: test
  image: golangci/golangci-lint:latest
  before_script:
    - mkdir -p ui/dist && touch ui/dist/.gitkeep
  script:
    - golangci-lint run ./...
  allow_failure: true

go-test:
  stage: test
  image: golang:1.26
  before_script:
    - mkdir -p ui/dist && touch ui/dist/.gitkeep
  script:
    - go test ./... -cover
  allow_failure: true

ui-test:
  stage: test
  image: node:22-alpine
  cache:
    key: ui-npm-$CI_COMMIT_REF_SLUG
    paths:
      - ui/node_modules/
  script:
    - cd ui && npm ci && npm run test:coverage

chart-test:
  stage: test
  extends: .check-helm
  variables:
    CHECK_PATH: "./chart"

# BUILD
img-base:
  extends: .create_image
  variables:
    FILE_PATH: "Dockerfile"

test-img:
  extends: .create_image
  variables:
    FILE_PATH: "Dockerfile.tests"
    REGISTRY_PATH: "smoke"
  needs:
    - job: release-dry-run
      optional: true
  rules:
    - changes:
        - Dockerfile.tests
        - tests/requirements.txt

build-ui:
  image: docker.io/node:22-alpine
  stage: build
  script: |
    cd ui
    npm ci
    npm run build
  artifacts:
    paths:
    - ui/dist/*
    when: on_success
    expire_in: 10 days

# build ui with embedded binary, then upload to generic package registry.
# BUILD_VERSION comes from the semantic-release-dry-run job in the semver
# stage (dotenv artifact propagation via `needs:`).
build-binary:
  needs:
    - build-ui
    - release-dry-run
  image: golang:1.26
  stage: build
  script:
    - go build .
    - |
      if [ -z "${BUILD_VERSION:-}" ]; then
        echo "BUILD_VERSION not set by release-dry-run — skipping publish"
        exit 0
      fi
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        VERSION="${BUILD_VERSION}"
      else
        VERSION="${BUILD_VERSION}-${CI_COMMIT_REF_SLUG}"
      fi
      UPLOAD_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/alatyr"
      echo "Publishing alatyr @ ${VERSION}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file alatyr \
        "${UPLOAD_BASE}/${VERSION}/alatyr"
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ] && [ "${MAKE_RELEASE:-FALSE}" = "TRUE" ]; then
        echo "Default branch + release-worthy commit — also publishing as 'latest'"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file alatyr \
          "${UPLOAD_BASE}/latest/alatyr"
      fi
  artifacts:
    paths:
      - alatyr
    when: on_success
    expire_in: 10 days

cli-test:
  needs:
    - img-base
    - release-dry-run
  stage: smoke-tests
  image:
    name: $CI_REGISTRY_IMAGE:$IMG_TAG
    entrypoint: [""]
  script:
    - echo "Testing image ${CI_REGISTRY_IMAGE}:${IMG_TAG}"
    - alatyr -report -f ./test-data/scenarios/01-k8s-baseline -format json -output res.json
    - test -s res.json
    - cat res.json
  artifacts:
    when: always
    paths:
      - res.json
    expire_in: 10 days
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        IMG_TAG: "$BUILD_VERSION"
    - when: on_success
      variables:
        IMG_TAG: "$BUILD_VERSION-$CI_COMMIT_BRANCH"

smoke-tests:
  needs:
    - build-binary
  stage: smoke-tests
  image: registry.dev.local/home-lab/network-policy-visualizer/smoke:0.1.2-49-metrics-enpoint-and-grafana-dashboard
  variables:
    BACKEND_PORT: "8080"
  script:
    - export HOME=$CI_PROJECT_DIR
    - export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
    - mkdir -p $CI_PROJECT_DIR/.kwok
    - cp -r /kwok-preload/.kwok/cache $CI_PROJECT_DIR/.kwok/
    - mkdir -p tests/results
    - kwokctl delete cluster --name graph-tests 2>/dev/null || true
    - kwokctl create cluster --name graph-tests --runtime=binary
    - kwokctl get kubeconfig --name graph-tests > $KUBECONFIG
    - kubectl apply -f $ISTIO_CRDS_FILE
    - kubectl wait --for=condition=Established
        crd/authorizationpolicies.security.istio.io
        crd/peerauthentications.security.istio.io
        --timeout=30s
    - chmod +x ./alatyr
    - sleep 20
    - |
      cat > tests/results/test-config.yaml <<EOF
      cacheRefreshSec: 1
      EOF
    - env -u DEMO_MODE
        KUBECONFIG=$KUBECONFIG
        CONFIG_PATH=$CI_PROJECT_DIR/tests/results/test-config.yaml
        ./alatyr > tests/results/backend.log 2>&1 &
    - |
      for i in $(seq 1 30); do
        curl -fsS http://localhost:${BACKEND_PORT}/api/cluster-state >/dev/null 2>&1 && break
        sleep 1
      done
    - cd tests && pytest --html=results/report.html --self-contained-html --junitxml=results/junit.xml -vv
  artifacts:
    when: always
    paths:
      - tests/results/
    reports:
      junit: tests/results/junit.xml

# STATIC DEMO SITE
# The Go backend never runs on GitHub Pages. It runs here, just long enough for
# scripts/snapshot-api.py to freeze every /api/* response into ui/public/demo/,
# then the UI is rebuilt with VITE_DEMO_MODE=true so the frontend reads those
# files instead of calling the API.
demo-site:
  stage: build
  needs:
    - build-binary
  image: docker.io/node:22
  variables:
    VITE_DEMO_MODE: "true"
    VITE_BASE: "/alatyr/"
  cache:
    key: ui-npm-$CI_COMMIT_REF_SLUG
    paths:
      - ui/node_modules/
  script:
    - apt-get update && apt-get install -y --no-install-recommends python3 curl
    - chmod +x ./alatyr
    - DEMO_MODE=true ./alatyr > demo-backend.log 2>&1 &
    - |
      for _ in $(seq 1 30); do
        curl -fsS http://localhost:8080/api/cluster-state >/dev/null 2>&1 && break
        sleep 1
      done
    # Fail before publishing if a demo scenario stopped producing its finding —
    # a caption asserting something the panel no longer shows is worse than no
    # demo. Same registry the UI reads.
    - python3 scripts/check-scenarios.py
    - python3 scripts/snapshot-api.py --out ui/public/demo
    - cd ui && npm ci && npm run build
    - touch dist/.nojekyll
  artifacts:
    paths:
      - ui/dist
      - demo-backend.log
    expire_in: 10 days


# Security scans
semgrep-sast:
  stage: security

trivy-dependency-scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs . --scanners vuln --exit-code 1 --severity HIGH,CRITICAL
  allow_failure: true

dockerfile-check:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config . --exit-code 1 --severity HIGH,CRITICAL --skip-files Dockerfile.sandbox,Dockerfile.tests --skip-dirs test-data

git-leaks:
  stage: security
  extends: .secrets_scan

try-image-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_INSECURE: "true"
    TRIVY_NON_SSL: "true"
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image ${CI_REGISTRY_IMAGE}:latest --exit-code 1 --severity HIGH,CRITICAL
  allow_failure: true

create-release:
  extends: .publish-release

# GITHUB MIRROR PUBLISH (manual — smoke test that uploads work)
# GITHUB_TOKEN: classic PAT, scopes repo + write:packages, masked+protected CI var.
# Both jobs publish to the throwaway tag $GITHUB_TEST_TAG, overwritten each run.
github-binary:
  stage: release
  needs:
    - build-binary
    - release-dry-run
  # gh preinstalled — the runner is non-root, so `apk add` can't write the apk db
  image:
    name: docker.io/maniator/gh:latest
    entrypoint: [""]
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - export GH_TOKEN="$GITHUB_TOKEN"
    # tag may not exist on the mirror yet — create release first, fall back to upload
    - |
      gh release create "$BUILD_VERSION" \
        --repo "$GITHUB_REPO" \
        --title "$CI_COMMIT_TITLE" \
        --notes "$CI_COMMIT_MESSAGE" \
        --prerelease alatyr \
      || gh release upload "$BUILD_VERSION" alatyr --repo "$GITHUB_REPO" --clobber
  rules:
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

github-image:
  stage: release
  needs:
    - img-base
    - release-dry-run
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    # internal registry is self-signed, hence src-tls-verify=false
    - |
      skopeo copy --all \
        --src-tls-verify=false \
        --src-creds "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" \
        --dest-creds "${GITHUB_USER}:${GITHUB_TOKEN}" \
        "docker://${CI_REGISTRY_IMAGE}:${BUILD_VERSION}" \
        "docker://${GHCR_IMAGE}:${BUILD_VERSION}"
  rules:
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Force-pushes the built site to the mirror's gh-pages branch. Pages is
# configured to serve that branch, so nothing runs on GitHub's side.
github-pages:
  stage: release
  needs:
    - demo-site
    - release-dry-run
  # git preinstalled — the runner is non-root, so `apk add` can't write the apk db
  image:
    name: docker.io/alpine/git:latest
    entrypoint: [""]
  when: manual
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - cd ui/dist
    - git init -q .
    - git config user.email "ci@gitlab.dev.io"
    - git config user.name "gitlab-ci"
    - git add -A
    - git commit -qm "demo site from $CI_COMMIT_SHA (pipeline $CI_PIPELINE_ID)"
    - git push -q --force "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" HEAD:gh-pages