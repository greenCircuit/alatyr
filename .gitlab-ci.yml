stages:
  - semver
  - test
  - build
  - security
  - release

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - project: home-lab/pipeline-catalog
    file: pipelines/security.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/build.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/release.yaml

release-dry-run:
  extends: .semantic-release-dry-run

# TESTS
go-lint:
  stage: test
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run ./...
  allow_failure: true

go-test:
  stage: test
  image: golang:1.26
  script:
    - go test ./... -cover
  allow_failure: true

ui-test:
  stage: test
  image: node:22-alpine
  cache:
    key: ui-npm-$CI_COMMIT_REF_SLUG
    paths:
      - ui/node_modules/
  script:
    - cd ui && npm ci && npm run test:coverage

# BUILD
img-base:
  extends: .create_image
  variables:
    FILE_PATH: "Dockerfile"

build-ui:
  image: docker.io/node:22-alpine
  stage: build
  script: |
    cd ui
    npm ci
    npm run build
  artifacts:
    paths:
    - ui/dist/*
    when: on_success
    expire_in: 10 days

# build ui with embedded binary, then upload to generic package registry.
# BUILD_VERSION comes from the semantic-release-dry-run job in the semver
# stage (dotenv artifact propagation via `needs:`).
build-binary:
  needs:
    - build-ui
    - release-dry-run
  image: golang:1.26
  stage: build
  script:
    - go build .
    - |
      if [ -z "${BUILD_VERSION:-}" ]; then
        echo "BUILD_VERSION not set by release-dry-run — skipping publish"
        exit 0
      fi
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        VERSION="${BUILD_VERSION}"
      else
        VERSION="${BUILD_VERSION}-${CI_COMMIT_REF_SLUG}"
      fi
      UPLOAD_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/graph"
      echo "Publishing graph @ ${VERSION}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file graph \
        "${UPLOAD_BASE}/${VERSION}/graph"
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ] && [ "${MAKE_RELEASE:-FALSE}" = "TRUE" ]; then
        echo "Default branch + release-worthy commit — also publishing as 'latest'"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file graph \
          "${UPLOAD_BASE}/latest/graph"
      fi
  artifacts:
    paths:
      - graph
    when: on_success
    expire_in: 10 days

# Security scans
semgrep-sast:
  stage: security

trivy-dependency-scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs . --scanners vuln --exit-code 1 --severity HIGH,CRITICAL

dockerfile-check:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config . --exit-code 1 --severity HIGH,CRITICAL --skip-files Dockerfile.sandbox --skip-dirs test-data

git-leaks:
  stage: security
  extends: .secrets_scan

try-image-scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image ${CI_REGISTRY_IMAGE}:latest --exit-code 1 --severity HIGH,CRITICAL
  allow_failure: true

create-release:
  extends: .publish-release