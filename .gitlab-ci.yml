stages:
  - semver
  - test
  - build
  - smoke-tests
  - security
  - release

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - project: home-lab/pipeline-catalog
    file: pipelines/security.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/build.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/release.yaml

release-dry-run:
  extends: .semantic-release-dry-run

# TESTS
go-lint:
  stage: test
  image: golangci/golangci-lint:latest
  before_script:
    - mkdir -p ui/dist && touch ui/dist/.gitkeep
  script:
    - golangci-lint run ./...
  allow_failure: true

go-test:
  stage: test
  image: golang:1.26
  before_script:
    - mkdir -p ui/dist && touch ui/dist/.gitkeep
  script:
    - go test ./... -cover
  allow_failure: true

ui-test:
  stage: test
  image: node:22-alpine
  cache:
    key: ui-npm-$CI_COMMIT_REF_SLUG
    paths:
      - ui/node_modules/
  script:
    - cd ui && npm ci && npm run test:coverage

# BUILD
img-base:
  extends: .create_image
  variables:
    FILE_PATH: "Dockerfile"

test-img:
  extends: .create_image
  variables:
    FILE_PATH: "Dockerfile.tests"
    REGISTRY_PATH: "smoke"
  needs:
    - job: release-dry-run
      optional: true
  rules:
    - changes:
        - Dockerfile.tests
        - tests/requirements.txt

build-ui:
  image: docker.io/node:22-alpine
  stage: build
  script: |
    cd ui
    npm ci
    npm run build
  artifacts:
    paths:
    - ui/dist/*
    when: on_success
    expire_in: 10 days

# build ui with embedded binary, then upload to generic package registry.
# BUILD_VERSION comes from the semantic-release-dry-run job in the semver
# stage (dotenv artifact propagation via `needs:`).
build-binary:
  needs:
    - build-ui
    - release-dry-run
  image: golang:1.26
  stage: build
  script:
    - go build .
    - |
      if [ -z "${BUILD_VERSION:-}" ]; then
        echo "BUILD_VERSION not set by release-dry-run — skipping publish"
        exit 0
      fi
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        VERSION="${BUILD_VERSION}"
      else
        VERSION="${BUILD_VERSION}-${CI_COMMIT_REF_SLUG}"
      fi
      UPLOAD_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/graph"
      echo "Publishing graph @ ${VERSION}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file graph \
        "${UPLOAD_BASE}/${VERSION}/graph"
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ] && [ "${MAKE_RELEASE:-FALSE}" = "TRUE" ]; then
        echo "Default branch + release-worthy commit — also publishing as 'latest'"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file graph \
          "${UPLOAD_BASE}/latest/graph"
      fi
  artifacts:
    paths:
      - graph
    when: on_success
    expire_in: 10 days
    
smoke-tests:
  needs:
    - build-binary
  stage: smoke-tests
  image: registry.dev.local/home-lab/network-policy-visualizer/smoke:0.1.0-3-add-smoke-robot-tests-to-pipeline
  variables:
    BACKEND_PORT: "8080"
  script:
    - export HOME=$CI_PROJECT_DIR
    - export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
    - mkdir -p $CI_PROJECT_DIR/.kwok
    - cp -r /kwok-preload/.kwok/cache $CI_PROJECT_DIR/.kwok/
    - mkdir -p tests/results
    - kwokctl delete cluster --name graph-tests 2>/dev/null || true
    - kwokctl create cluster --name graph-tests --runtime=binary
    - kwokctl get kubeconfig --name graph-tests > $KUBECONFIG
    - kubectl apply -f $ISTIO_CRDS_FILE
    - chmod +x ./graph
    - sleep 10
    - env -u DEMO_MODE KUBECONFIG=$KUBECONFIG ./graph > tests/results/backend.log 2>&1 &
    - |
      for i in $(seq 1 30); do
        curl -fsS http://localhost:${BACKEND_PORT}/api/cluster-state >/dev/null 2>&1 && break
        sleep 1
      done
    - cd tests && pytest --html=results/report.html --self-contained-html --junitxml=results/junit.xml -vv
  artifacts:
    when: always
    paths:
      - tests/results/
    reports:
      junit: tests/results/junit.xml

# Security scans
semgrep-sast:
  stage: security

trivy-dependency-scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs . --scanners vuln --exit-code 1 --severity HIGH,CRITICAL
  allow_failure: true

dockerfile-check:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config . --exit-code 1 --severity HIGH,CRITICAL --skip-files Dockerfile.sandbox,Dockerfile.tests --skip-dirs test-data

git-leaks:
  stage: security
  extends: .secrets_scan

try-image-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_INSECURE: "true"
    TRIVY_NON_SSL: "true"
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image ${CI_REGISTRY_IMAGE}:latest --exit-code 1 --severity HIGH,CRITICAL
  allow_failure: true

create-release:
  extends: .publish-release