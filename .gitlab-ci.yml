variables:
  GITHUB_USER: "greenCircuit"
  GITHUB_REPO: "greenCircuit/network-policy-visualizer"
  GHCR_IMAGE: "ghcr.io/greencircuit/network-policy-visualizer"
  GITHUB_TEST_TAG: "ci-test"

stages:
  - semver
  - test
  - build
  - smoke-tests
  - security
  - release

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - project: home-lab/pipeline-catalog
    file: pipelines/security.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/build.yaml
  - project: home-lab/pipeline-catalog
    file: pipelines/release.yaml

release-dry-run:
  extends: .semantic-release-dry-run

# TESTS
go-lint:
  stage: test
  image: golangci/golangci-lint:latest
  before_script:
    - mkdir -p ui/dist && touch ui/dist/.gitkeep
  script:
    - golangci-lint run ./...
  allow_failure: true

go-test:
  stage: test
  image: golang:1.26
  before_script:
    - mkdir -p ui/dist && touch ui/dist/.gitkeep
  script:
    - go test ./... -cover
  allow_failure: true

ui-test:
  stage: test
  image: node:22-alpine
  cache:
    key: ui-npm-$CI_COMMIT_REF_SLUG
    paths:
      - ui/node_modules/
  script:
    - cd ui && npm ci && npm run test:coverage

# BUILD
img-base:
  extends: .create_image
  variables:
    FILE_PATH: "Dockerfile"

test-img:
  extends: .create_image
  variables:
    FILE_PATH: "Dockerfile.tests"
    REGISTRY_PATH: "smoke"
  needs:
    - job: release-dry-run
      optional: true
  rules:
    - changes:
        - Dockerfile.tests
        - tests/requirements.txt

build-ui:
  image: docker.io/node:22-alpine
  stage: build
  script: |
    cd ui
    npm ci
    npm run build
  artifacts:
    paths:
    - ui/dist/*
    when: on_success
    expire_in: 10 days

# build ui with embedded binary, then upload to generic package registry.
# BUILD_VERSION comes from the semantic-release-dry-run job in the semver
# stage (dotenv artifact propagation via `needs:`).
build-binary:
  needs:
    - build-ui
    - release-dry-run
  image: golang:1.26
  stage: build
  script:
    - go build .
    - |
      if [ -z "${BUILD_VERSION:-}" ]; then
        echo "BUILD_VERSION not set by release-dry-run — skipping publish"
        exit 0
      fi
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        VERSION="${BUILD_VERSION}"
      else
        VERSION="${BUILD_VERSION}-${CI_COMMIT_REF_SLUG}"
      fi
      UPLOAD_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/graph"
      echo "Publishing graph @ ${VERSION}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file graph \
        "${UPLOAD_BASE}/${VERSION}/graph"
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ] && [ "${MAKE_RELEASE:-FALSE}" = "TRUE" ]; then
        echo "Default branch + release-worthy commit — also publishing as 'latest'"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file graph \
          "${UPLOAD_BASE}/latest/graph"
      fi
  artifacts:
    paths:
      - graph
    when: on_success
    expire_in: 10 days
    
smoke-tests:
  needs:
    - build-binary
  stage: smoke-tests
  image: registry.dev.local/home-lab/network-policy-visualizer/smoke:0.1.0-3-add-smoke-robot-tests-to-pipeline
  variables:
    BACKEND_PORT: "8080"
  script:
    - export HOME=$CI_PROJECT_DIR
    - export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
    - mkdir -p $CI_PROJECT_DIR/.kwok
    - cp -r /kwok-preload/.kwok/cache $CI_PROJECT_DIR/.kwok/
    - mkdir -p tests/results
    - kwokctl delete cluster --name graph-tests 2>/dev/null || true
    - kwokctl create cluster --name graph-tests --runtime=binary
    - kwokctl get kubeconfig --name graph-tests > $KUBECONFIG
    - kubectl apply -f $ISTIO_CRDS_FILE
    - chmod +x ./graph
    - sleep 10
    - env -u DEMO_MODE KUBECONFIG=$KUBECONFIG ./graph > tests/results/backend.log 2>&1 &
    - |
      for i in $(seq 1 30); do
        curl -fsS http://localhost:${BACKEND_PORT}/api/cluster-state >/dev/null 2>&1 && break
        sleep 1
      done
    - cd tests && pytest --html=results/report.html --self-contained-html --junitxml=results/junit.xml -vv
  artifacts:
    when: always
    paths:
      - tests/results/
    reports:
      junit: tests/results/junit.xml

# STATIC DEMO SITE
# The Go backend never runs on GitHub Pages. It runs here, just long enough for
# scripts/snapshot-api.py to freeze every /api/* response into ui/public/demo/,
# then the UI is rebuilt with VITE_DEMO_MODE=true so the frontend reads those
# files instead of calling the API.
demo-site:
  stage: build
  needs:
    - build-binary
  image: docker.io/node:22
  variables:
    VITE_DEMO_MODE: "true"
    VITE_BASE: "/network-policy-visualizer/"
  cache:
    key: ui-npm-$CI_COMMIT_REF_SLUG
    paths:
      - ui/node_modules/
  script:
    - apt-get update && apt-get install -y --no-install-recommends python3 curl
    - chmod +x ./graph
    - DEMO_MODE=true ./graph > demo-backend.log 2>&1 &
    - |
      for _ in $(seq 1 30); do
        curl -fsS http://localhost:8080/api/cluster-state >/dev/null 2>&1 && break
        sleep 1
      done
    - python3 scripts/snapshot-api.py --out ui/public/demo
    - cd ui && npm ci && npm run build
    - touch dist/.nojekyll
  artifacts:
    paths:
      - ui/dist
      - demo-backend.log
    expire_in: 10 days

# Force-pushes the built site to the mirror's gh-pages branch. Pages is
# configured to serve that branch, so nothing runs on GitHub's side.
github-pages:
  stage: release
  needs:
    - demo-site
  image: alpine:3.20
  when: manual
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - apk add --no-cache git
    - cd ui/dist
    - git init -q .
    - git config user.email "ci@gitlab.dev.io"
    - git config user.name "gitlab-ci"
    - git add -A
    - git commit -qm "demo site from $CI_COMMIT_SHA (pipeline $CI_PIPELINE_ID)"
    - git push -q --force "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" HEAD:gh-pages

# Security scans
semgrep-sast:
  stage: security

trivy-dependency-scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs . --scanners vuln --exit-code 1 --severity HIGH,CRITICAL
  allow_failure: true

dockerfile-check:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config . --exit-code 1 --severity HIGH,CRITICAL --skip-files Dockerfile.sandbox,Dockerfile.tests --skip-dirs test-data

git-leaks:
  stage: security
  extends: .secrets_scan

try-image-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_INSECURE: "true"
    TRIVY_NON_SSL: "true"
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image ${CI_REGISTRY_IMAGE}:latest --exit-code 1 --severity HIGH,CRITICAL
  allow_failure: true

create-release:
  extends: .publish-release

# GITHUB MIRROR PUBLISH (manual — smoke test that uploads work)
# GITHUB_TOKEN: classic PAT, scopes repo + write:packages, masked+protected CI var.
# Both jobs publish to the throwaway tag $GITHUB_TEST_TAG, overwritten each run.
github-binary:
  stage: release
  needs:
    - build-binary
  image: alpine:3.20
  when: manual
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - apk add --no-cache github-cli
    - export GH_TOKEN="$GITHUB_TOKEN"
    # tag may not exist on the mirror yet — create release first, fall back to upload
    - |
      gh release create "$GITHUB_TEST_TAG" \
        --repo "$GITHUB_REPO" \
        --title "$GITHUB_TEST_TAG" \
        --notes "pipeline $CI_PIPELINE_ID / commit $CI_COMMIT_SHA" \
        --prerelease graph \
      || gh release upload "$GITHUB_TEST_TAG" graph --repo "$GITHUB_REPO" --clobber

github-image:
  stage: release
  needs:
    - img-base
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  when: manual
  allow_failure: true
  variables:
    GIT_STRATEGY: none
    SRC_IMAGE_TAG: "latest"
  script:
    # internal registry is self-signed, hence src-tls-verify=false
    - |
      skopeo copy --all \
        --src-tls-verify=false \
        --src-creds "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" \
        --dest-creds "${GITHUB_USER}:${GITHUB_TOKEN}" \
        "docker://${CI_REGISTRY_IMAGE}:${SRC_IMAGE_TAG}" \
        "docker://${GHCR_IMAGE}:${GITHUB_TEST_TAG}"