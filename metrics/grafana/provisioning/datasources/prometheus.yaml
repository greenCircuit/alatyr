# Grafana provisioning: auto-registers the Prometheus datasource at
# startup. See https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
apiVersion: 1

datasources:
  - name: Prometheus
    # Explicit UID so the shipped dashboard JSON can reference this
    # datasource without depending on Grafana's name-based UID derivation.
    uid: alatyr-prometheus
    type: prometheus
    access: proxy
    # network_mode: host puts Prometheus on the host loopback interface,
    # same one Grafana lives on.
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
