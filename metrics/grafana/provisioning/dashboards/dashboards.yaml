# Grafana provisioning: auto-loads every dashboard JSON in the mounted
# directory and re-checks the folder on the interval below.
# https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
apiVersion: 1

providers:
  - name: alatyr
    orgId: 1
    folder: Alatyr
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
